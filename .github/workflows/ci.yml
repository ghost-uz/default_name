name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # qo'lda ishga tushirish uchun

# ⚠️ Bir branch'ga ketma-ket push qilinsa, eskisi BEKOR QILINADI.
#    Aks holda 3 ta push = 3 ta parallel ishga tushirish va navbat.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12" # lokal .venv bilan AYNAN bir xil

jobs:
  # =======================================================================
  # 1. Kod sifati
  # =======================================================================
  sifat:
    name: Sifat (ruff, mypy, django check)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # ⚠️ NEGA LINT ISHIGA BAZA KERAK (D1-T5 dan keyin paydo bo'lgan talab)
    #    `manage.py check` va `makemigrations --check` sof statik tahlil EMAS.
    #
    #    Zanjir:
    #      1. `Complaint.score_cached` — `models.GeneratedField`;
    #      2. uning tizim tekshiruvi `_check_supported()` maqsad bazaning
    #         `connection.features.supports_stored_generated_columns` ini
    #         o'qiydi, PostgreSQL'da bu esa serverning HAQIQIY versiyasini
    #         so'raydi -> jonli ulanish;
    #      3. `--database` berilmagani "hech qaysi baza" degani EMAS:
    #         django/core/checks/registry.py da
    #             if databases is None: databases = list(connections)
    #         ya'ni "belgilanmagan" = "HAMMASI".
    #
    #    Bu lokalda ko'rinmaydi — dasturchida Docker'dagi Postgres ishlab
    #    turadi. Shuning uchun `pre-commit run --all-files` lokalda o'tdi,
    #    CI'da esa "Connection refused" bilan yiqildi.
    #
    #    Hooklarni SKIP qilish yo'li ATAYLAB tanlanmadi: u holda "migratsiya
    #    yaratilmagan" xatosi CI'dan o'tib, deploy'gacha yashirinardi.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dard
          POSTGRES_USER: dard
          POSTGRES_PASSWORD: dard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Loyiha standarti 5434 (lokal Docker stack'lar to'qnashmasligi uchun),
      # GitHub xizmati esa runner'da localhost:5432 da turadi.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: dard
      POSTGRES_USER: dard
      POSTGRES_PASSWORD: dard

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Bog'liqliklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      # pre-commit o'z hook muhitlarini yuklab oladi — ularni keshlaymiz
      - name: pre-commit keshi
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # ⚠️ CI ayni SHU hooklarni ishlatadi — lokal bilan bir xil.
      #    ruff/mypy'ni bu yerda alohida yozsak, ular vaqt o'tib
      #    .pre-commit-config.yaml dan uzoqlashadi va "lokalda o'tdi,
      #    CI'da yiqildi" holati paydo bo'ladi.
      #
      #    `language: system` hooklari (mypy, manage.py check) runner'ning
      #    python'idan foydalanadi — yuqorida requirements o'rnatilgani
      #    uchun ular ishlaydi.
      - name: pre-commit (barcha fayllar)
        run: pre-commit run --all-files --show-diff-on-failure

  # =======================================================================
  # 2. Testlar
  # =======================================================================
  test:
    name: Testlar (pytest + qamrov)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dard
          POSTGRES_USER: dard
          POSTGRES_PASSWORD: dard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # ⚠️ MUHIM: loyiha sozlamasida POSTGRES_PORT standarti 5434 (lokal
      #    Docker stack'lar to'qnashmasligi uchun). GitHub xizmatlari esa
      #    runner'da localhost:5432 da turadi — shuning uchun bu yerda
      #    ochiq berilishi SHART.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: dard
      POSTGRES_USER: dard
      POSTGRES_PASSWORD: dard
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      # ⚠️ DJANGO_SETTINGS_MODULE ATAYLAB BERILMAGAN.
      #    U muhit o'zgaruvchisi sifatida pyproject.toml dagi sozlamadan
      #    USTUN turadi. Berilsa-yu xato yozilsa, conftest.py darhol
      #    to'xtatadi — lekin umuman bermaslik xavfsizroq.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Bog'liqliklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      # ⚠️ CSS QURILISHI TESTDAN OLDIN — D2-T1 da qo'shildi.
      #    `static/css/app.css` .gitignore da (qurilish artefakti), ya'ni
      #    toza checkout'da u YO'Q. Usiz `TailwindBuildTests` tekshiradigan
      #    fayl mavjud bo'lmasdi va guard CI'da jimgina ishlamay qolardi.
      #    Bu ayni paytda "shablon o'zgardi, CSS qurilmadi" holatini ham
      #    CI darajasida ushlaydi.
      - name: Tailwind CSS
        run: |
          npm ci
          npm run build

      # ⚠️ `--create-db`: CI'da baza har safar toza, lekin buyruq lokal
      #    ko'rsatma bilan bir xil bo'lsin — hujjat va amaliyot ajralmasin.
      - name: pytest
        run: pytest --create-db

      - name: Qamrov xulosasi
        if: always()
        run: |
          echo "### Qamrov" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  # =======================================================================
  # 3. Docker obrazi quriladimi
  # =======================================================================
  # ⚠️ NEGA ALOHIDA: testlar va lint runner'da to'g'ridan-to'g'ri ishlaydi,
  #    prod esa KONTEYNERDA. Dockerfile buzilsa (masalan yangi tizim
  #    kutubxonasi kerak bo'lsa) buni faqat deploy paytida bilardik —
  #    ya'ni eng qimmat joyda.
  docker:
    name: Docker obrazi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write # GHCR

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # ⚠️ Obraz FAQAT shu yerda quriladi.
      #    Ilgari deploy ham qurardi — ikki marta qurish vaqt yeydi VA
      #    deploy'da manba kodini checkout qilishni talab qilardi, bu esa
      #    "pwn request" hujum yuzasini ochardi (deploy.yml izohiga qarang).
      - name: Teg
        id: teg
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "image=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]'):${SHA:0:12}" >> "$GITHUB_OUTPUT"

      # Obraz GHCR ga FAQAT `main`ga push bo'lganda yuboriladi.
      # PR'larda u faqat quriladi (Dockerfile buzilmaganini tekshirish
      # uchun) — lekin registry'ga tushmaydi.
      - name: GHCR ga kirish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Obrazni qurish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          target: runtime
          build-args: REQUIREMENTS=prod
          tags: ${{ steps.teg.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =======================================================================
  # 4. Yig'ma holat — branch himoyasi SHU tekshiruvga bog'lanadi
  # =======================================================================
  # ⚠️ Nega kerak: branch protection'da har bir job'ni alohida tanlash
  #    kerak bo'lardi va yangi job qo'shilganda uni qo'lda qo'shish
  #    unutiladi. Bitta yig'ma tekshiruv bu muammoni yo'q qiladi.
  ci:
    name: CI holati
    runs-on: ubuntu-latest
    needs: [sifat, test, docker]
    if: always()
    steps:
      - name: Natijani tekshirish
        run: |
          echo "sifat : ${{ needs.sifat.result }}"
          echo "test  : ${{ needs.test.result }}"
          echo "docker: ${{ needs.docker.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::CI yiqildi"
            exit 1
          fi
          echo "CI yashil"
