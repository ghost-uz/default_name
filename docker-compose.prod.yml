# Dard.uz — ishlab chiqarish uchun ustama (override).
#
# Ishlatish:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Dev'dan farqlari:
#   - kod obraz ICHIDA (volume ulanmaydi) -> serverda kod tahrirlanmaydi
#   - runserver o'rniga gunicorn
#   - nginx qo'shiladi: statik fayllar va TLS terminatsiyasi
#   - db va redis portlari TASHQARIGA CHIQARILMAYDI

x-django-prod: &django-prod
  build:
    context: .
    dockerfile: Dockerfile
    args:
      REQUIREMENTS: prod
  image: dard-web:prod
  environment: &django-prod-env
    DJANGO_SETTINGS_MODULE: config.settings.prod
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    # Bularsiz konteyner KO'TARILMAYDI (config/settings/prod.py)
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
    DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin}
    DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-3600}
  volumes:
    # ⚠️ Kod volume'i YO'Q — obrazdagi kod ishlatiladi.
    - static_data:/app/staticfiles
    - media_data:/app/media
  restart: always

services:
  db:
    # Port tashqariga chiqarilmaydi — faqat ichki tarmoq.
    # Kerak bo'lsa SSH tunnel orqali ulaning.
    ports: !override []

  redis:
    ports: !override []

  web:
    <<: *django-prod
    environment:
      <<: *django-prod-env
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --timeout=60
      - --access-logfile=-
      - --error-logfile=-
    ports: !override []  # nginx orqali kiriladi
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    <<: *django-prod
    command: celery -A config worker --loglevel=info --concurrency=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    <<: *django-prod
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------- nginx --
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Statik fayllarni Django emas, nginx beradi — bu Gunicorn worker'larini
      # bo'shatadi va javob vaqtini sezilarli qisqartiradi.
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always
