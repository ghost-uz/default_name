# Dard.uz — lokal ishlab chiqish stek'i.
#
# Ishga tushirish:  docker compose up -d --build
# Loglar:           docker compose logs -f web
# To'xtatish:       docker compose down          (ma'lumot saqlanadi)
#                   docker compose down -v       (ma'lumot ham O'CHADI)
#
# ⚠️ HOST PORTLARI standart 5432/6379/8000 EMAS. Sabab: bu mashinada boshqa
#    Docker stek'lari shu portlarni band qilishi mumkin va o'shanda
#    "Bind for 0.0.0.0:5432 failed" xatosi chiqadi. Kerak bo'lsa .env da
#    o'zgartiring — konteyner ichidagi portlar o'zgarmaydi.

name: dard

# --------------------------------------------------------------------------
# Django konteynerlari uchun umumiy sozlamalar (web, celery-worker, beat)
# --------------------------------------------------------------------------
x-django: &django
  build:
    context: .
    dockerfile: Dockerfile
    args:
      REQUIREMENTS: dev
  image: dard-web:dev
  environment: &django-env
    DJANGO_SETTINGS_MODULE: config.settings.dev
    # ⚠️ ENG MUHIM QATOR. Konteyner ichida `db` xizmatiga ICHKI port (5432)
    #    orqali ulaniladi — host'dagi 5434 EMAS. Bu sozlamasiz Django
    #    "connection refused" beradi va sababi darhol ko'rinmaydi.
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-dard}
    POSTGRES_USER: ${POSTGRES_USER:-dard}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dard}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    USE_REDIS_IN_DEV: "1"
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    # Kod host'dan ulanadi -> tahrir darhol ko'rinadi (autoreload).
    # ⚠️ Prod'da bu YO'Q: docker-compose.prod.yml ga qarang.
    - .:/app
    - static_data:/app/staticfiles
    - media_data:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ db --
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dard}
      POSTGRES_USER: ${POSTGRES_USER:-dard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dard}
      # Ma'lumotlar buzilishini erta aniqlash
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # ⚠️ `depends_on: condition: service_healthy` shu tekshiruvga tayanadi.
      #    Usiz web konteyneri Postgres tayyor bo'lishidan OLDIN ishga
      #    tushadi va migratsiya yiqiladi.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dard} -d ${POSTGRES_DB:-dard}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------- redis --
  redis:
    image: redis:7-alpine
    # appendonly: qayta ishga tushganda navbatdagi vazifalar yo'qolmasin
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ----------------------------------------------------------------- web --
  web:
    <<: *django
    environment:
      <<: *django-env
      # ⚠️ Migratsiya FAQAT shu xizmatda ishlaydi. Worker va beat ham shu
      #    obrazni ishlatadi — ular ham migratsiya qilsa poyga holati bo'ladi.
      RUN_MIGRATIONS: "1"
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${WEB_HOST_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ------------------------------------------------------- celery-worker --
  celery-worker:
    <<: *django
    command: celery -A config worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --------------------------------------------------------- celery-beat --
  celery-beat:
    <<: *django
    # ⚠️ beat FAQAT BITTA nusxada ishlashi kerak — ikkita bo'lsa har bir
    #    rejalashtirilgan vazifa ikki marta yuboriladi.
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
