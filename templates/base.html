{% load static statik %}<!doctype html>
<html lang="uz" class="{% block html_class %}{% endblock %}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{% block title %}Dard.uz — Nolima, yechim topamiz{% endblock %}</title>
    <meta name="description" content="{% block description %}Dard.uz — hayotiy muammolaringiz bilan o'rtoqlashing va real tajribaga asoslangan yechim toping.{% endblock %}" />
    <meta name="theme-color" content="#2563eb" />
    {% comment %}
      ⚠️⚠️ HTMX O'Z `<style>` BLOKINI KIRITMASIN (D2-T9).

         Standart holatda HTMX `<head>` ga inline `<style>` qo'shadi
         (`.htmx-indicator{opacity:0}` ...). CSP'da `style-src` da
         `'unsafe-inline'` yo'q, ya'ni u BLOKLANADI va har sahifa
         yuklanishida konsolda buzilish qoladi.

         Uni nonce bilan o'tkazish ham mumkin edi
         (`inlineStyleNonce`), lekin u holda `style-src` ga nonce
         qo'shish kerak bo'lardi — ya'ni inline `<style>` bloklariga
         umuman yo'l ochilardi. Uslublar bizning CSS'imizda tursa,
         `style-src` butunlay qat'iy qoladi.

         Uslublar: `tailwind/input.css` -> `.htmx-indicator`.
    {% endcomment %}
    <meta name="htmx-config" content='{"includeIndicatorStyles": false}' />

    {% block head_extra %}{% endblock %}

    {% comment %}
      FOUC oldini olish: mavzu CSS'dan OLDIN qo'llanadi, aks holda sahifa
      bir lahza oq bo'lib "chaqnaydi".
      ⚠️ nonce SHART: D2-T9 da CSP yoqilganda nonce'siz inline skript
         bloklanadi va butun sayt yorug' rejimda "sakraydi".
    {% endcomment %}
    <script nonce="{{ request.csp_nonce }}">
      (function () {
        var t = localStorage.getItem("dard-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static_v 'css/app.css' %}" />
  </head>

  {% comment %}
    `data-guest` — app.js mehmon xulqini shundan biladi (login taklifi,
    D1-T8). Ilgari u `?guest=1` dan o'qilardi: bu maketni sinash uchun
    edi va haqiqiy sessiyada HECH QACHON ishlamasdi.

    `hx-headers` — HTMX butun sahifa uchun CSRF sarlavhasini oladi.
    Formalar `{% csrf_token %}` bilan ham yuboradi; bu esa kelajakdagi
    formasiz `hx-post` lar uchun (aks holda ular 403 bilan qaytardi va
    sababi ko'rinmasdi).
  {% endcomment %}
  <body
    class="{% block body_class %}{% endblock %}"
    data-guest="{{ request.user.is_authenticated|yesno:'false,true' }}"
    data-login-url="{% url 'login' %}"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
  >
    <a href="#main" class="skip-link">Asosiy kontentga o'tish</a>

    {% block header %}{% include "components/_header.html" %}{% endblock %}
    {% block drawer %}{% include "components/_drawer.html" %}{% endblock %}

    {% comment %}
      ⚠️ D2-T1 da qo'shildi. Undan oldin `messages.success(...)` chaqiruvlari
         (D1-T9 dan beri 6 ta) HECH QAYERDA ko'rsatilmasdi — foydalanuvchi
         "Dardingiz e'lon qilindi" degan tasdiqni hech qachon ko'rmagan.
         Guard: `apps/common/tests/test_templates.py::XabarlarTests`.
    {% endcomment %}
    {% include "components/_messages.html" %}

    {% comment %}
      ⚠️ Cheklov banneri XABARLARDAN KEYIN, kontentdan OLDIN (D2-T11).
         Xabar — bir martalik ("Dardingiz e'lon qilindi"), banner esa
         HOLAT: u cheklov tugaguncha turadi. Ularni almashtirsak,
         cheklov xabari har navigatsiyada yangi xabardek ko'rinardi.
    {% endcomment %}
    {% include "components/_cheklov_banner.html" %}

    {% block content %}{% endblock %}

    {% block footer %}{% include "components/_footer.html" %}{% endblock %}

    {% block bottom_nav %}{% include "components/_bottom_nav.html" %}{% endblock %}

    {% include "components/_toast_root.html" %}

    {% comment %}
      HTMX vendorlangan (CDN EMAS): D2-T9 da CSP yoqilganda tashqi skript
      bloklanadi, bundan tashqari CDN uzilishi butun ovoz berishni
      o'chirib qo'yardi. Versiya `package.json` da emas — u faqat
      Tailwind quvuri uchun; bu fayl bevosita repoda turadi.
    {% endcomment %}
    <script src="{% static_v 'js/vendor/htmx.min.js' %}" defer></script>
    <script src="{% static_v 'js/app.js' %}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
