# Dard.uz — nginx (prod).
#
# TLS bu yerda yo'q: sertifikatni Let's Encrypt/certbot yoki Cloudflare
# boshqaradi (D0-T10). Bu konfiguratsiya HTTP darajasida ishlaydi va
# HTTPS ekanini yuqori qatlamdan `X-Forwarded-Proto` orqali oladi.

upstream django {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Foydalanuvchi yuklaydigan rasm hajmi (Django tomonda ham cheklangan)
    client_max_body_size 5m;

    # nginx versiyasi javob sarlavhasida ko'rinmasin
    server_tokens off;

    # ---------------------------------------------------------------- gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # ------------------------------------------------------- statik fayllar
    # ManifestStaticFilesStorage fayl nomiga hash qo'shadi (app.a1b2c3.css),
    # shuning uchun uzoq muddatli kesh XAVFSIZ: kontent o'zgarsa nom o'zgaradi.
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media hash'lanmaydi -> qisqaroq kesh
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ------------------------------------------------------------ health
    # Monitoring loglarni to'ldirmasin.
    #
    # ⚠️⚠️ SARLAVHALAR BU YERDA HAM TAKRORLANADI — ATAYLAB.
    #    `proxy_set_header` MEROS OLINMAYDI: agar blokda bittasi
    #    ko'rsatilsa, tashqi blokdagilar butunlay bekor bo'ladi.
    #    Hech biri bo'lmasa esa nginx `Host:` ga UPSTREAM NOMINI
    #    (`django`) qo'yadi — Django uni ALLOWED_HOSTS da topmay 400
    #    (DisallowedHost) qaytaradi.
    #
    #    Bu haqiqatan yuz berdi: `/` ishlardi, `/health/` esa 400 berardi.
    #    Oqibati — deploy workflow'idagi sog'liq tekshiruvi HAR SAFAR
    #    yiqilardi, sayt esa aslida ishlab turgan bo'lardi. Xabar
    #    ("200 soniyada o'tmadi") sababni ko'rsatmasdi.
    location = /health/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        access_log off;
    }

    # -------------------------------------------------------------- Django
    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ⚠️ Django prod.py da SECURE_PROXY_SSL_HEADER shu sarlavhaga tayanadi.
        #    U yo'q bo'lsa Django HTTPS'ni tanimaydi va cheksiz qayta
        #    yo'naltirish (redirect loop) yuzaga keladi.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
